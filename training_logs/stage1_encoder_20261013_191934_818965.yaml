paths:
  project_root: /home/mjp/Project/PLM/UnifyImmun
  data_root: /home/mjp/Project/PLM/UnifyImmun/dataset
  cache_root: /home/mjp/Project/PLM/UnifyImmun/embedding_cache/plm_stage1_ph_pt
  output_root: /home/mjp/Project/PLM/UnifyImmun/trained_model/PLM_Stage1_Encoder
  swanlog_root: /home/mjp/Project/PLM/UnifyImmun/swanlog
  esmc_model: /home/mjp/model/ESMC-300M
  tcr_bert_model: /home/mjp/model/TCR-Bert
model:
  peptide_input_dim: 960
  hla_input_dim: 960
  tcr_input_dim: 768
  model_dim: 256
  num_attention_heads: 8
  feedforward_dim: 1024
  encoder_num_layers: 3
  encoder_dropout: 0.15
  attention_dropout: 0.15
  classifier_dropout: 0.25
  peptide_min_length: 8
  peptide_max_length: 15
  hla_max_length: 34
  tcr_max_length: 34
cache:
  dtype: float16
  shard_size: 16384
  precompute_batch_size: 32
  compression: null
  hla_splits:
  - train
  - val_unseen_hla
  - val_unseen_pair
  - val_unseen_peptide
  tcr_splits:
  - train
  - val_unseen_pair
  - val_unseen_peptide
  - val_unseen_tcr
training:
  fold: 1
  seed: 42
  seeds:
  - 42
  - 3407
  - 2026
  batch_size: 1024
  online_batch_size: 32
  num_workers: 2
  warmup_epochs_per_task: 2
  max_rounds: 50
  early_stopping_patience: 5
  early_stopping_min_delta: 0.001
  encoder_lr: 0.0003
  cross_attention_lr: 0.0002
  pooling_lr: 0.0003
  classifier_lr: 0.0003
  shared_peptide_encoder_lr: 5.0e-05
  hla_encoder_lr: 0.0001
  tcr_encoder_lr: 0.0001
  phla_cross_attention_lr: 0.0001
  ptcr_cross_attention_lr: 7.5e-05
  phla_pooling_lr: 0.0001
  ptcr_pooling_lr: 0.0001
  phla_classifier_lr: 7.5e-05
  ptcr_classifier_lr: 7.5e-05
  weight_decay: 0.01
  no_decay_bias_and_norm: true
  scheduler_warmup_ratio: 0.05
  scheduler_total_rounds: 40
  scheduler_warmup_rounds: 1
  scheduler_min_lr_ratio: 0.05
  gradient_clip_norm: 1.0
  fgm_epsilon: 1.0
  phla_fgm_epsilon: 0.5
  ptcr_fgm_epsilon: 0.5
  phla_adversarial_loss_weight: 0.25
  ptcr_adversarial_loss_weight: 0.25
  adversarial_warmup_rounds: 2
  phla_label_smoothing: 0.01
  ptcr_label_smoothing: 0.015
  phla_group_weighting: inverse_sqrt
  ptcr_group_weighting: inverse_sqrt
  group_weight_min: 0.5
  group_weight_max: 2.0
  phla_early_stopping_patience: 5
  ptcr_early_stopping_patience: 5
  round_early_stopping_patience: 5
  task_step_ratio_enabled: false
  phla_task_step_ratio: 1.0
  ptcr_task_step_ratio: 1.0
  retention_eval_enabled: true
  retention_tolerance: 0.01
  selection_calibration_guard_enabled: true
  selection_nll_tolerance: 0.05
  selection_ece_tolerance: 0.02
  threshold: 0.5
  mixed_precision: bf16
  log_every_steps: 50
  pin_memory: true
  persistent_workers: false
  device: cuda
  best_umap_enabled: true
  best_umap_max_samples_per_split: 1000
  best_umap_random_state: 42
  best_umap_n_neighbors: 30
  best_umap_min_dist: 0.1
swanlab:
  project: unifyimmun
  workspace: null
  mode: online
  group: plm-stage1-encoder-fold{fold}
  experiment_prefix: PLM-Stage1-Encoder
  tags:
  - ESMC-300M
  - TCR-BERT
  - FGM
  - stage1_encoder
  - self-attention
  - unified
source_path: /home/mjp/Project/PLM/UnifyImmun/configs/plm_stage1_encoder.yaml
