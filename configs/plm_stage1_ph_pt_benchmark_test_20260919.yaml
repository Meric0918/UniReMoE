paths:
  project_root: ..
  data_root: ../dataset
  cache_root: ../embedding_cache/plm_stage1_ph_pt_benchmark_test
  output_root: ../trained_model/PLM_Unified_PH_PT
  swanlog_root: ../swanlog
  esmc_model: /home/mjp/model/ESMC-300M
  tcr_bert_model: /home/mjp/model/TCR-Bert

model:
  peptide_input_dim: 960
  hla_input_dim: 960
  tcr_input_dim: 768
  adapter_hidden_dim: 256
  model_dim: 256
  num_attention_heads: 8
  feedforward_dim: 1024
  adapter_dropout: 0.15
  attention_dropout: 0.15
  classifier_dropout: 0.25
  peptide_min_length: 8
  peptide_max_length: 15
  hla_max_length: 34
  tcr_max_length: 34

cache:
  dtype: float16
  shard_size: 16384
  precompute_batch_size: 32
  compression: null
  hla_splits:
    - test_unseen_hla
    - test_unseen_pair
    - test_unseen_peptide
  tcr_splits:
    - test_unseen_pair
    - test_unseen_peptide
    - test_unseen_tcr

training:
  fold: 1
  seed: 42
  seeds: [42, 3407, 2026]
  batch_size: 1024
  online_batch_size: 32
  num_workers: 2
  warmup_epochs_per_task: 2
  max_rounds: 100
  early_stopping_patience: 20
  early_stopping_min_delta: 0.001
  adapter_lr: 0.0003
  cross_attention_lr: 0.0002
  pooling_lr: 0.0003
  classifier_lr: 0.0003
  weight_decay: 0.01
  scheduler_warmup_ratio: 0.05
  gradient_clip_norm: 1.0
  fgm_epsilon: 1.0
  phla_adversarial_loss_weight: 0.25
  ptcr_adversarial_loss_weight: 0.25
  selection_calibration_guard_enabled: true
  selection_nll_tolerance: 0.05
  selection_ece_tolerance: 0.02
  threshold: 0.5
  mixed_precision: bf16
  log_every_steps: 50
  pin_memory: true
  persistent_workers: false
  device: auto

swanlab:
  project: unifyimmun
  workspace: null
  mode: disabled
  group: plm-stage1-ph-pt-benchmark-test
  experiment_prefix: PLM-Stage1-PH-PT-Benchmark-Test
  tags: [ESMC-300M, TCR-BERT, FGM, stage1, PH, PT, benchmark-test]
